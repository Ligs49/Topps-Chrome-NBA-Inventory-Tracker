name: Hourly inventory check

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run inventory monitor
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBERS: ${{ secrets.ALERT_PHONE_NUMBERS }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python monitor.py

      - name: Save inventory state
        run: |
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"

          git add inventory_state.json

          if git diff --cached --quiet; then
            echo "No inventory changes to save."
            exit 0
          fi

          git commit -m "Update inventory state"

          git pull --rebase origin main
          git push origin main
