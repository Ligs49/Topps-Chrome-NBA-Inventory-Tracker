      - name: Save inventory state
        run: |
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"

          # Preserve the inventory result created by this run
          cp inventory_state.json /tmp/inventory_state.json

          # Sync to the newest version of main
          git fetch origin main
          git reset --hard origin/main

          # Restore this run's newest inventory result
          cp /tmp/inventory_state.json inventory_state.json

          git add inventory_state.json

          if git diff --cached --quiet; then
            echo "No inventory changes to save."
            exit 0
          fi

          git commit -m "Update inventory state"
          git push origin main
